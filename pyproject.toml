[project]
name = "rag-study"
version = "0.1.0"
description = "Estudo comparativo: LLM sem contexto, RAG ingênuo e RAG com rerank."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.39"]
openai = ["openai>=1.50"]

[project.scripts]
rag-study = "rag_study.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
